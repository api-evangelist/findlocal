aid: findlocal
name: FindLocal
image: https://findlocal.community/og-default.png
description: FindLocal provides a hyper‑local events API that aggregates over 86,000 upcoming events from more than 10,000 venues across 83 US
  metros. The platform offers JSON API access and an MCP server for developers to integrate event data into applications, with features like searchable
  calendars, maps, and widgets. Users can sign up for free API keys, manage billing, and explore event data via a developer portal. The service
  reads venue calendars directly, ensuring up‑to‑date listings of concerts, comedy shows, theater, and community events, and offers a free tier
  of 1,000 calls per month with no credit‑card required.
